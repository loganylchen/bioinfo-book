<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 522" role="img"><title>87 个共同命中，分母是什么？</title><desc>两项人类筛选的命中清单，不是五项研究的交集图</desc><rect width="920" height="522" rx="26" fill="#f3f7fa"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="60" font-size="40" fill="#1c3044" font-weight="700">87 个共同命中，分母是什么？</text><text x="47" y="104" font-size="24" fill="#39566e" font-weight="400">两项人类筛选的命中清单，不是五项研究的交集图</text><rect x="43" y="129" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="139" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="160" font-size="26" fill="#155c56" font-weight="700">筛选甲｜Ng 等</text><text x="68" y="194" font-size="23" fill="#1c3044" font-weight="400">290 个命中，其中 203 个仅见于甲。</text><text text-anchor="end" x="855" y="160" font-size="19" fill="#576b7b" font-weight="400">290 − 87</text><rect x="43" y="241" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="251" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="272" font-size="26" fill="#155c56" font-weight="700">筛选乙｜Joung 等</text><text x="68" y="306" font-size="23" fill="#1c3044" font-weight="400">496 个命中，其中 409 个仅见于乙。</text><text text-anchor="end" x="855" y="272" font-size="19" fill="#576b7b" font-weight="400">496 − 87</text><rect x="43" y="353" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="363" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="384" font-size="26" fill="#155c56" font-weight="700">两项都命中</text><text x="68" y="418" font-size="23" fill="#1c3044" font-weight="400">87 / (290 + 496 − 87) = 12.4%。</text><text text-anchor="end" x="855" y="384" font-size="19" fill="#576b7b" font-weight="400">87 / 699</text><text x="47" y="499" font-size="19" fill="#486273" font-weight="400">按综述正文数字独立整理｜699 是命中并集，不是共同受测因子数。</text></g></svg>
