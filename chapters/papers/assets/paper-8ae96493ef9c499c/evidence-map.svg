<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 522" role="img"><title>三种测量，不能互换</title><desc>读 Zhang 等：先看样本、距离单位和观察方式</desc><rect width="920" height="522" rx="26" fill="#f3f7fa"/><g font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif"><text x="45" y="60" font-size="40" fill="#1c3044" font-weight="700">三种测量，不能互换</text><text x="47" y="104" font-size="24" fill="#39566e" font-weight="400">读 Zhang 等：先看样本、距离单位和观察方式</text><rect x="43" y="129" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="139" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="160" font-size="26" fill="#155c56" font-weight="700">群体 Hi-C</text><text x="68" y="194" font-size="23" fill="#1c3044" font-weight="400">同基因组距离下找接触异常，对应 CLOD 候选。</text><text text-anchor="end" x="855" y="160" font-size="19" fill="#576b7b" font-weight="400">Fig. 1a–f</text><rect x="43" y="241" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="251" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="272" font-size="26" fill="#155c56" font-weight="700">chr2 快照｜IMR90</text><text x="68" y="306" font-size="23" fill="#1c3044" font-weight="400">&gt;100 Mb；2,991 条轨迹；299 nm 定义空间接近。</text><text text-anchor="end" x="855" y="272" font-size="19" fill="#576b7b" font-weight="400">Fig. 2</text><rect x="43" y="353" width="834" height="96" rx="12" fill="white" stroke="#b6cfdb"/><rect x="43" y="363" width="6" height="76" rx="3" fill="#1f7f78"/><text x="68" y="384" font-size="26" fill="#155c56" font-weight="700">chr14 活细胞｜HEK293T</text><text x="68" y="418" font-size="23" fill="#1c3044" font-weight="400">约 80 Mb 的一对；4 个细胞各跟踪 60 分钟。</text><text text-anchor="end" x="855" y="384" font-size="19" fill="#576b7b" font-weight="400">Fig. 1h–j</text><text x="47" y="499" font-size="19" fill="#486273" font-weight="400">原创阅读图｜没有重绘作者数据、热图或轨迹；原证据见正文链接。</text></g></svg>
